<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .lane { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .k { font-size: 11px; fill: #6b7580; }
    .t { font-size: 14px; font-weight: 700; fill: #14181d; }
    .tag { font-size: 11px; fill: #6b7580; }
    .box { fill: #fff; stroke-width: 1.5; }
  </style>
  <rect width="1180" height="420" rx="14" fill="#ffffff" stroke="#e4e7eb"/>

  <!-- HubSpot lane -->
  <text x="24" y="38" class="lane" fill="#d9622b">HUBSPOT WORKFLOW</text>
  <rect x="24" y="52" width="200" height="60" rx="10" class="box" stroke="#d9622b"/><text x="38" y="76" class="k">Trigger</text><text x="38" y="98" class="t">Lifecycle stage = SQL</text>
  <rect x="264" y="52" width="170" height="60" rx="10" class="box" stroke="#d9622b"/><text x="278" y="76" class="k">Action 1</text><text x="278" y="98" class="t">Send webhook</text>
  <rect x="474" y="52" width="170" height="60" rx="10" class="box" stroke="#d9622b"/><text x="488" y="76" class="k">Action 2</text><text x="488" y="98" class="t">Delay 5 minutes</text>
  <rect x="684" y="52" width="190" height="60" rx="10" class="box" stroke="#d9622b"/><text x="698" y="76" class="k">Action 3</text><text x="698" y="98" class="t">Rotate to sales rep</text>
  <path d="M224 82 H264 M434 82 H474 M644 82 H684" stroke="#d9622b" stroke-width="2" fill="none"/>

  <!-- bridge -->
  <path d="M349 112 V160 H94 V190" stroke="#a3acb5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="360" y="150" class="tag">contact data</text>

  <!-- n8n lane -->
  <text x="24" y="180" class="lane" fill="#2747d8">N8N</text>
  <rect x="24" y="190" width="140" height="60" rx="10" class="box" stroke="#2747d8"/><text x="38" y="214" class="k">Webhook</text><text x="38" y="236" class="t">Receive lead</text>
  <rect x="194" y="190" width="150" height="60" rx="10" class="box" stroke="#2747d8"/><text x="208" y="214" class="k">Apify</text><text x="208" y="236" class="t">LinkedIn data</text>
  <rect x="374" y="190" width="150" height="60" rx="10" class="box" stroke="#2747d8"/><text x="388" y="214" class="k">Claude</text><text x="388" y="236" class="t">Compare</text>
  <rect x="554" y="190" width="150" height="60" rx="10" class="box" stroke="#2747d8"/><text x="568" y="214" class="k">Code</text><text x="568" y="236" class="t">Parse result</text>
  <rect x="734" y="190" width="140" height="60" rx="10" class="box" stroke="#2747d8"/><text x="748" y="214" class="k">IF</text><text x="748" y="236" class="t">Still there?</text>
  <path d="M164 220 H194 M344 220 H374 M524 220 H554 M704 220 H734" stroke="#2747d8" stroke-width="2" fill="none"/>

  <!-- branches -->
  <path d="M874 220 C904 220 904 160 934 160" stroke="#1d8a52" stroke-width="2" fill="none"/>
  <text x="884" y="176" class="tag">yes</text>
  <rect x="934" y="130" width="220" height="60" rx="10" class="box" stroke="#1d8a52"/><text x="948" y="154" class="k">HTTP request</text><text x="948" y="176" class="t">Note on HubSpot contact</text>

  <path d="M874 220 C904 220 904 300 934 300" stroke="#d4472c" stroke-width="2" fill="none"/>
  <text x="884" y="278" class="tag">no</text>
  <rect x="934" y="270" width="220" height="60" rx="10" class="box" stroke="#d4472c"/><text x="948" y="294" class="k">Claude + web search</text><text x="948" y="316" class="t">Research new company</text>
  <path d="M1044 330 V350" stroke="#d4472c" stroke-width="2" fill="none"/>
  <rect x="934" y="350" width="220" height="50" rx="10" class="box" stroke="#d4472c"/><text x="948" y="381" class="t">Slack alert</text>

  <!-- travelling dot -->
  <circle r="6" fill="#2747d8">
    <animateMotion dur="7s" repeatCount="indefinite" path="M124 82 H349 V160 H94 V220 H804 C904 220 904 160 1044 160"/>
  </circle>
  <circle r="6" fill="#d4472c">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M124 82 H349 V160 H94 V220 H804 C904 220 904 300 1044 300 V375"/>
  </circle>
</svg>
