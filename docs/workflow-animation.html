<title>Lead Re-enrichment Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one wide SVG stage on white; a dot travels the pipeline, the branch alternates each loop, then the maker's name closes the sequence */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --ink: #14181d;
  --rule: #e4e7eb;
  --idle: #f5f6f8;
  --muted: #8a939d;
  --flow: #2747d8;     /* main path */
  --stay: #1d8a52;     /* still at company */
  --left: #d4472c;     /* changed company */
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  display: grid; place-items: center;
}
.stage { width: 100%; max-width: 1180px; position: relative; }
svg { width: 100%; height: auto; display: block; overflow: visible; }

.edge { fill: none; stroke: var(--rule); stroke-width: 2; }
.edge-live { fill: none; stroke-width: 2.5; stroke-linecap: round; }

.node rect { fill: var(--idle); stroke: var(--rule); stroke-width: 1.5; transition: fill .35s, stroke .35s; }
.node .glyph { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .35s; }
.node .glyph-fill { fill: var(--muted); transition: fill .35s; }
.node text { font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--muted); text-anchor: middle; transition: fill .35s; }
.node.on rect { fill: #fff; stroke: var(--c, var(--flow)); }
.node.on .glyph { stroke: var(--c, var(--flow)); }
.node.on .glyph-fill { fill: var(--c, var(--flow)); }
.node.on text { fill: var(--ink); }
.node.pop rect { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.node rect { transform-box: fill-box; transform-origin: center; }

.tag { font-family: var(--mono); font-size: 11px; fill: var(--muted); text-anchor: middle; letter-spacing: .04em; }
.dot { transition: fill .2s; }

.sign {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px;
  background: var(--paper); opacity: 0; pointer-events: none; transition: opacity .8s ease;
}
.sign.show { opacity: 1; }
.sign .name { font-family: var(--serif); font-size: clamp(40px, 7vw, 76px); line-height: 1; letter-spacing: -.01em; }
.sign .rule { width: 0; height: 2px; background: var(--flow); transition: width 1s ease .3s; }
.sign.show .rule { width: min(220px, 40vw); }

@media (prefers-reduced-motion: reduce) { .node rect { animation: none !important; } .sign, .sign .rule { transition: none; } }
</style>

<div class="stage">
  <svg viewBox="0 0 1180 470" role="img" aria-label="HubSpot SQL, webhook, LinkedIn data, AI compare, parse, still at company check, then either a HubSpot note and rep assignment, or company research and a Slack alert">
    <!-- edges (static) -->
    <g id="edges"></g>
    <!-- nodes -->
    <g id="nodes"></g>
    <text class="tag" x="838" y="150">still there</text>
    <text class="tag" x="838" y="330">changed company</text>
    <circle class="dot" id="dot" r="6" cx="-20" cy="-20" fill="var(--flow)"/>
  </svg>
  <div class="sign" id="sign" aria-hidden="true">
    <div class="name">Aisha Aliyu</div>
    <div class="rule"></div>
  </div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const W = 108, H = 84;

// glyphs are drawn in a 28x28 box centred above the label
const glyphs = {
  crm:     '<circle class="glyph" cx="14" cy="9" r="5"/><path class="glyph" d="M4 25c1-6 5-9 10-9s9 3 10 9"/>',
  hook:    '<path class="glyph" d="M9 20a6 6 0 1 1 5-9l4 7"/><circle class="glyph-fill" cx="20" cy="20" r="3"/><path class="glyph" d="M22 9h-8"/>',
  profile: '<rect class="glyph" x="4" y="4" width="20" height="20" rx="4"/><path class="glyph" d="M9 12v8M9 8.5v.1M13 20v-5a3 3 0 0 1 6 0v5"/>',
  compare: '<path class="glyph" d="M5 9h12M13 5l4 4-4 4M23 19H11M15 15l-4 4 4 4"/>',
  parse:   '<path class="glyph" d="M10 4c-3 0-4 2-4 4v3c0 2-2 3-2 3s2 1 2 3v3c0 2 1 4 4 4M18 4c3 0 4 2 4 4v3c0 2 2 3 2 3s-2 1-2 3v3c0 2-1 4-4 4"/>',
  split:   '<path class="glyph" d="M4 14h8M12 14l8-8M12 14l8 8"/><circle class="glyph-fill" cx="21" cy="6" r="2.5"/><circle class="glyph-fill" cx="21" cy="22" r="2.5"/>',
  note:    '<path class="glyph" d="M6 4h12l5 5v15H6z"/><path class="glyph" d="M10 14h9M10 19h6"/>',
  rep:     '<circle class="glyph" cx="11" cy="9" r="4"/><path class="glyph" d="M3 24c1-5 4-7 8-7s7 2 8 7M20 11l2 2 4-4"/>',
  search:  '<circle class="glyph" cx="12" cy="12" r="7"/><path class="glyph" d="M17 17l7 7"/>',
  chat:    '<path class="glyph" d="M4 6h20v13H12l-6 5v-5H4z"/><path class="glyph" d="M9 12h10"/>'
};

const nodes = {
  sql:      { x: 8,    y: 193, label: "SQL in HubSpot", g: "crm" },
  hook:     { x: 144,  y: 193, label: "Webhook", g: "hook" },
  linkedin: { x: 280,  y: 193, label: "LinkedIn data", g: "profile" },
  compare:  { x: 416,  y: 193, label: "AI compare", g: "compare" },
  parse:    { x: 552,  y: 193, label: "Parse", g: "parse" },
  check:    { x: 688,  y: 193, label: "Still there?", g: "split" },
  note:     { x: 880,  y: 40,  label: "HubSpot note", g: "note", c: "var(--stay)" },
  rep:      { x: 1050, y: 40,  label: "Rep assigned", g: "rep", c: "var(--stay)" },
  research: { x: 880,  y: 346, label: "Research", g: "search", c: "var(--left)" },
  slack:    { x: 1050, y: 346, label: "Slack alert", g: "chat", c: "var(--left)" }
};

const mid = n => ({ cx: n.x + W / 2, cy: n.y + H / 2 });
function edgePath(a, b) {
  const A = nodes[a], B = nodes[b];
  const s = { x: A.x + W, y: A.y + H / 2 }, e = { x: B.x, y: B.y + H / 2 };
  if (Math.abs(s.y - e.y) < 1) return `M${s.x} ${s.y} H${e.x}`;
  const mx = (s.x + e.x) / 2;
  return `M${s.x} ${s.y} C${mx} ${s.y} ${mx} ${e.y} ${e.x} ${e.y}`;
}

const edgeList = [
  ["sql","hook"],["hook","linkedin"],["linkedin","compare"],["compare","parse"],["parse","check"],
  ["check","note"],["note","rep"],["check","research"],["research","slack"]
];
const edgesG = document.getElementById("edges");
const edgeEls = {};
edgeList.forEach(([a, b]) => {
  const d = edgePath(a, b);
  const base = document.createElementNS(NS, "path");
  base.setAttribute("d", d); base.setAttribute("class", "edge");
  const live = document.createElementNS(NS, "path");
  live.setAttribute("d", d); live.setAttribute("class", "edge-live");
  live.setAttribute("stroke", nodes[b].c || "var(--flow)");
  edgesG.append(base, live);
  const len = live.getTotalLength();
  live.style.strokeDasharray = len; live.style.strokeDashoffset = len;
  edgeEls[a + ">" + b] = { live, len };
});

const nodesG = document.getElementById("nodes");
const nodeEls = {};
Object.entries(nodes).forEach(([k, n]) => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node");
  if (n.c) g.style.setProperty("--c", n.c);
  g.innerHTML = `<rect x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="14"/>
    <g transform="translate(${n.x + W / 2 - 14} ${n.y + 14})">${glyphs[n.g]}</g>
    <text x="${n.x + W / 2}" y="${n.y + H - 14}">${n.label}</text>`;
  nodesG.appendChild(g);
  nodeEls[k] = g;
});

const dot = document.getElementById("dot");
const sign = document.getElementById("sign");
const wait = ms => new Promise(r => setTimeout(r, ms));

function light(k) {
  const el = nodeEls[k];
  el.classList.add("on");
  el.classList.remove("pop"); void el.getBBox(); el.classList.add("pop");
}
function reset() {
  Object.values(nodeEls).forEach(el => el.classList.remove("on", "pop"));
  Object.values(edgeEls).forEach(({ live, len }) => { live.style.transition = "none"; live.style.strokeDashoffset = len; });
  dot.setAttribute("cx", -20); dot.setAttribute("cy", -20);
}

function travel(a, b, ms) {
  const { live, len } = edgeEls[a + ">" + b];
  dot.setAttribute("fill", nodes[b].c || "var(--flow)");
  return new Promise(resolve => {
    const t0 = performance.now();
    function frame(t) {
      const p = Math.min(1, (t - t0) / ms);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const pt = live.getPointAtLength(len * e);
      dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
      live.style.transition = "none";
      live.style.strokeDashoffset = len * (1 - e);
      p < 1 ? requestAnimationFrame(frame) : resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function run(branch) {
  reset();
  await wait(400);
  const route = ["sql","hook","linkedin","compare","parse","check"].concat(branch === "stay" ? ["note","rep"] : ["research","slack"]);
  light(route[0]);
  await wait(500);
  for (let i = 1; i < route.length; i++) {
    await travel(route[i - 1], route[i], 700);
    light(route[i]);
    await wait(route[i] === "check" ? 650 : 280);
  }
  dot.setAttribute("cx", -20); dot.setAttribute("cy", -20);
  await wait(1400);
}

async function loop() {
  while (true) {
    sign.classList.remove("show");
    await run("stay");
    await run("left");
    sign.classList.add("show");
    await wait(3200);
  }
}

if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  Object.values(nodeEls).forEach(el => el.classList.add("on"));
  Object.values(edgeEls).forEach(({ live }) => { live.style.strokeDashoffset = 0; });
} else {
  loop();
}
</script>
